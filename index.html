<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>GymMotion 3D</title>

<style>
*{box-sizing:border-box;margin:0;padding:0}

:root{
 --bg:#050b09;
 --panel:#0c1713;
 --panel2:#10231b;
 --line:#1c382c;
 --text:#f3fff8;
 --muted:#8ca69a;
 --green:#62f3a0;
 --green2:#a9ffd0;
}

body{
 background:
 radial-gradient(circle at 15% 0%,#123d2a 0,transparent 32%),
 radial-gradient(circle at 90% 20%,#09291d 0,transparent 30%),
 var(--bg);
 color:var(--text);
 font-family:Arial,Helvetica,sans-serif;
 min-height:100vh;
}

button,a{font-family:inherit}
a{text-decoration:none;color:inherit}

header{
 height:70px;
 display:flex;
 align-items:center;
 padding:0 5%;
 border-bottom:1px solid var(--line);
 background:rgba(5,11,9,.85);
 backdrop-filter:blur(15px);
 position:sticky;
 top:0;
 z-index:50;
}

.logo{
 font-size:20px;
 font-weight:900;
 letter-spacing:-.7px;
}

.logo b{color:var(--green)}

.logoDot{
 display:inline-block;
 width:10px;
 height:10px;
 background:var(--green);
 border-radius:50%;
 margin-right:9px;
 box-shadow:0 0 20px var(--green);
}

nav{
 margin-left:auto;
 display:flex;
 gap:22px;
}

nav a{
 color:var(--muted);
 font-size:14px;
 cursor:pointer;
}

nav a:hover{color:var(--green)}

.container{
 width:min(1180px,90%);
 margin:auto;
}

.hero{
 min-height:650px;
 display:grid;
 grid-template-columns:1.15fr .85fr;
 align-items:center;
 gap:50px;
}

.tag{
 color:var(--green);
 font-size:12px;
 font-weight:bold;
 letter-spacing:2px;
 text-transform:uppercase;
}

h1{
 font-size:clamp(48px,7vw,85px);
 line-height:.95;
 letter-spacing:-5px;
 margin:18px 0 25px;
}

.hero p{
 color:var(--muted);
 font-size:18px;
 line-height:1.7;
 max-width:650px;
}

.buttons{
 display:flex;
 gap:12px;
 margin-top:30px;
 flex-wrap:wrap;
}

.btn{
 border:1px solid var(--line);
 background:var(--panel);
 color:white;
 padding:13px 18px;
 border-radius:12px;
 cursor:pointer;
 font-weight:bold;
}

.btn:hover{
 border-color:var(--green);
 transform:translateY(-1px);
}

.primary{
 background:var(--green);
 color:#041009;
 border-color:var(--green);
}

.heroCard{
 padding:30px;
 border:1px solid var(--line);
 background:linear-gradient(145deg,var(--panel2),var(--panel));
 border-radius:25px;
 box-shadow:0 25px 80px rgba(0,0,0,.3);
}

.heroCard h2{
 margin:15px 0;
}

.heroCard p{
 font-size:14px;
}

.features{
 display:grid;
 grid-template-columns:repeat(3,1fr);
 gap:15px;
 padding:40px 0 80px;
}

.card{
 border:1px solid var(--line);
 background:linear-gradient(145deg,var(--panel2),var(--panel));
 border-radius:20px;
 padding:23px;
}

.card h3{margin:12px 0 8px}

.card p{
 color:var(--muted);
 font-size:14px;
 line-height:1.6;
}

.page{
 padding:55px 0 80px;
}

.pageTitle{
 margin-bottom:30px;
}

.pageTitle h2{
 font-size:44px;
 margin:8px 0;
}

.pageTitle p{
 color:var(--muted);
}

.exerciseGrid{
 display:grid;
 grid-template-columns:repeat(2,1fr);
 gap:15px;
}

.exercise{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:15px;
}

.exerciseIcon{
 font-size:35px;
}

.coach{
 display:grid;
 grid-template-columns:1fr 320px;
 gap:18px;
}

.viewer{
 height:650px;
 border:1px solid var(--line);
 border-radius:25px;
 overflow:hidden;
 background:#020604;
 position:relative;
}

.viewer canvas{
 width:100%;
 height:100%;
 display:block;
}

.hud{
 position:absolute;
 left:15px;
 right:15px;
 top:15px;
 display:flex;
 justify-content:space-between;
 pointer-events:none;
 z-index:5;
}

.badge{
 background:rgba(5,11,9,.75);
 border:1px solid var(--line);
 border-radius:10px;
 padding:9px 12px;
 font-size:12px;
 backdrop-filter:blur(10px);
}

.controls{
 display:flex;
 flex-direction:column;
 gap:15px;
}

.control{
 padding:20px;
 border:1px solid var(--line);
 background:var(--panel);
 border-radius:18px;
}

label{
 color:var(--muted);
 font-size:12px;
 display:block;
 margin-bottom:8px;
}

select,input{
 width:100%;
 padding:12px;
 background:#06100c;
 color:white;
 border:1px solid var(--line);
 border-radius:10px;
}

input[type=range]{
 padding:0;
}

.stat{
 display:flex;
 justify-content:space-between;
 padding:12px 0;
 border-bottom:1px solid var(--line);
 font-size:13px;
}

.stat:last-child{border:0}

.notice{
 padding:15px;
 border:1px solid #28553f;
 background:#0a2017;
 color:#a9d9bf;
 border-radius:14px;
 font-size:12px;
 line-height:1.6;
}

footer{
 border-top:1px solid var(--line);
 padding:25px 5%;
 color:var(--muted);
 font-size:12px;
}

@media(max-width:850px){

 nav{display:none}

 .hero{
  grid-template-columns:1fr;
  padding:55px 0;
 }

 .features{
  grid-template-columns:1fr;
 }

 .exerciseGrid{
  grid-template-columns:1fr;
 }

 .coach{
  grid-template-columns:1fr;
 }

 .viewer{
  height:540px;
 }

 h1{
  font-size:58px;
 }
}
</style>

<!--
  Import map fixes the Three.js / OrbitControls dependency.
-->
<script type="importmap">
{
  "imports":{
    "three":"https://cdn.jsdelivr.net/npm/three@0.164.1/build/three.module.js"
  }
}
</script>

</head>

<body>

<header>

<a href="#home" class="logo">
<span class="logoDot"></span>
GymMotion<b>3D</b>
</a>

<nav>
<a href="#home">Home</a>
<a href="#workouts">Workouts</a>
<a href="#coach">3D Coach</a>
<a href="#progress">Progress</a>
</nav>

</header>

<main id="app"></main>

<footer>
GymMotion 3D • Interactive workout visualization
</footer>


<script type="module">

import * as THREE from "three";

import {OrbitControls}
from "https://cdn.jsdelivr.net/npm/three@0.164.1/examples/jsm/controls/OrbitControls.js";


/* =====================================================
   DATA
===================================================== */

const exercises=[
 {
  id:"squat",
  name:"Bodyweight Squat",
  icon:"🦵",
  focus:"Quads • Glutes • Core"
 },
 {
  id:"curl",
  name:"Biceps Curl",
  icon:"💪",
  focus:"Biceps • Forearms"
 },
 {
  id:"pushup",
  name:"Push-Up",
  icon:"🏋️",
  focus:"Chest • Triceps • Core"
 },
 {
  id:"lunge",
  name:"Reverse Lunge",
  icon:"🦿",
  focus:"Glutes • Quads • Balance"
 },
 {
  id:"jump",
  name:"Jump Squat",
  icon:"⚡",
  focus:"Legs • Power"
 },
 {
  id:"row",
  name:"Dumbbell Row",
  icon:"🎯",
  focus:"Back • Biceps"
 }
];


function getProgress(){

 try{
  return JSON.parse(localStorage.getItem("gymProgress")) ||
  {reps:0,workouts:0};
 }catch{
  return {reps:0,workouts:0};
 }

}


function saveProgress(data){

 localStorage.setItem(
  "gymProgress",
  JSON.stringify(data)
 );

}


/* =====================================================
   ROUTER
===================================================== */

const app=document.getElementById("app");

window.addEventListener("hashchange",router);

function router(){

 let route=location.hash.replace("#","");

 if(!route) route="home";

 if(route==="home")
  home();

 else if(route==="workouts")
  workouts();

 else if(route==="progress")
  progress();

 else if(route.startsWith("coach"))
  coach(route.split("/")[1]||"squat");

 else
  home();

}


/* =====================================================
   HOME
===================================================== */

function home(){

 app.innerHTML=`

 <div class="container">

 <section class="hero">

 <div>

 <div class="tag">
 INTERACTIVE 3D TRAINING
 </div>

 <h1>
 Train form.<br>
 Not just reps.
 </h1>

 <p>
 Explore interactive exercise demonstrations,
 control the movement, rotate around the athlete
 and study exercise mechanics directly in your browser.
 </p>

 <div class="buttons">

 <a class="btn primary"
 href="#coach/squat">
 Open 3D Coach
 </a>

 <a class="btn"
 href="#workouts">
 Explore Exercises
 </a>

 </div>

 </div>


 <div class="heroCard">

 <div class="tag">
 GYMMOTION ENGINE
 </div>

 <h2>
 Your interactive training laboratory
 </h2>

 <p>
 Choose an exercise and interact with a
 real-time 3D humanoid model.
 Change tempo, rotate the camera and
 record repetitions.
 </p>

 <br>

 <div class="notice">
 This version uses a procedural 3D human
 model. A production version can replace
 it with a fully rigged realistic human
 character.
 </div>

 </div>

 </section>


 <section class="features">

 <div class="card">
 <div class="exerciseIcon">🎮</div>
 <h3>Interactive</h3>
 <p>
 Orbit the 3D character and control
 the exercise movement.
 </p>
 </div>

 <div class="card">
 <div class="exerciseIcon">🧠</div>
 <h3>Form focused</h3>
 <p>
 Each exercise has its own movement
 animation logic.
 </p>
 </div>

 <div class="card">
 <div class="exerciseIcon">💾</div>
 <h3>Your progress</h3>
 <p>
 Repetitions are saved locally in
 your browser.
 </p>
 </div>

 </section>

 </div>

 `;

}


/* =====================================================
   WORKOUTS
===================================================== */

function workouts(){

 app.innerHTML=`

 <div class="container page">

 <div class="pageTitle">

 <div class="tag">
 EXERCISE LIBRARY
 </div>

 <h2>Choose a movement</h2>

 <p>
 Select an exercise to open the interactive
 3D coach.
 </p>

 </div>


 <div class="exerciseGrid">

 ${exercises.map(e=>`

 <div class="card exercise">

 <div>

 <div class="exerciseIcon">
 ${e.icon}
 </div>

 <h3>${e.name}</h3>

 <p>${e.focus}</p>

 </div>

 <a
 class="btn primary"
 href="#coach/${e.id}">
 Open
 </a>

 </div>

 `).join("")}

 </div>

 </div>

 `;

}


/* =====================================================
   PROGRESS
===================================================== */

function progress(){

 const p=getProgress();

 app.innerHTML=`

 <div class="container page">

 <div class="pageTitle">

 <div class="tag">
 YOUR TRAINING
 </div>

 <h2>Progress</h2>

 <p>
 Your training information is stored locally.
 </p>

 </div>


 <div class="features">

 <div class="card">
 <div class="tag">REPS</div>
 <h2>${p.reps}</h2>
 </div>

 <div class="card">
 <div class="tag">WORKOUTS</div>
 <h2>${p.workouts}</h2>
 </div>

 <div class="card">
 <div class="tag">STATUS</div>
 <h2>Active</h2>
 </div>

 </div>

 <button
 class="btn"
 onclick="resetProgress()">
 Reset Progress
 </button>

 </div>

 `;

}


window.resetProgress=function(){

 localStorage.removeItem("gymProgress");

 router();

};


/* =====================================================
   3D COACH
===================================================== */

let renderer;
let scene;
let camera;
let controls;
let animationFrame;
let clock;
let character;


function coach(id){

 const exercise=
 exercises.find(e=>e.id===id) ||
 exercises[0];

 app.innerHTML=`

 <div class="container page">

 <div class="pageTitle">

 <div class="tag">
 3D COACH
 </div>

 <h2>${exercise.name}</h2>

 <p>
 ${exercise.focus}
 </p>

 </div>


 <div class="coach">

 <div class="viewer" id="viewer">

 <div class="hud">

 <div class="badge">
 ${exercise.name}
 </div>

 <div class="badge">
 Drag • Rotate • Zoom
 </div>

 </div>

 </div>


 <div class="controls">

 <div class="control">

 <label>
 EXERCISE
 </label>

 <select id="exerciseSelect">

 ${exercises.map(e=>`

 <option
 value="${e.id}"
 ${e.id===exercise.id?"selected":""}>
 ${e.name}
 </option>

 `).join("")}

 </select>

 </div>


 <div class="control">

 <label>
 MOVEMENT SPEED
 <span id="speedValue">1.0×</span>
 </label>

 <input
 id="speed"
 type="range"
 min=".3"
 max="2"
 step=".1"
 value="1">

 </div>


 <div class="control">

 <button
 id="repButton"
 class="btn primary"
 style="width:100%">
 COMPLETE REP
 </button>

 <div class="stat">
 <span>Reps</span>
 <b id="repCount">0</b>
 </div>

 </div>


 <div class="notice">

 <b>3D controls</b><br><br>

 Drag the character to rotate the
 camera.<br><br>

 Pinch or scroll to zoom.<br><br>

 Use the movement slider to change
 animation speed.

 </div>

 </div>

 </div>

 </div>

 `;


 init3D(exercise.id);

}


/* =====================================================
   HUMANOID
===================================================== */

function createHumanoid(){

 const group=new THREE.Group();

 const skin=
 new THREE.MeshStandardMaterial({
  color:0xc88768,
  roughness:.75
 });

 const shirt=
 new THREE.MeshStandardMaterial({
  color:0x173b2a,
  roughness:.8
 });

 const shorts=
 new THREE.MeshStandardMaterial({
  color:0x101817,
  roughness:.8
 });


 function capsule(radius,height,material){

  return new THREE.Mesh(
   new THREE.CapsuleGeometry(
    radius,
    height,
    8,
    16
   ),
   material
  );

 }


 function sphere(size,material){

  return new THREE.Mesh(
   new THREE.SphereGeometry(
    size,
    24,
    16
   ),
   material
  );

 }


 const root=new THREE.Group();

 group.add(root);


 /* pelvis */

 const pelvis=sphere(.36,shorts);

 pelvis.scale.set(1,.65,.75);

 pelvis.position.y=1.35;

 root.add(pelvis);


 /* torso */

 const torso=capsule(.38,1.0,shirt);

 torso.position.y=2.05;

 root.add(torso);


 /* neck */

 const neck=capsule(.13,.20,skin);

 neck.position.y=2.72;

 root.add(neck);


 /* head */

 const head=sphere(.30,skin);

 head.position.y=3.05;

 root.add(head);


 const parts={
  root,
  pelvis,
  torso,
  head,
  arms:[],
  forearms:[],
  thighs:[],
  shins:[]
 };


 for(const side of [-1,1]){

  /* upper arm */

  const arm=capsule(.14,.58,shirt);

  arm.position.set(
   side*.50,
   2.35,
   0
  );

  arm.rotation.z=side*.2;

  root.add(arm);


  /* forearm */

  const fore=capsule(.11,.58,skin);

  fore.position.set(
   side*.62,
   1.82,
   0
  );

  fore.rotation.z=side*.2;

  root.add(fore);


  /* thigh */

  const thigh=capsule(.18,.72,shorts);

  thigh.position.set(
   side*.20,
   .90,
   0
  );

  root.add(thigh);


  /* shin */

  const shin=capsule(.14,.78,skin);

  shin.position.set(
   side*.20,
   .25,
   0
  );

  root.add(shin);


  parts.arms.push(arm);
  parts.forearms.push(fore);
  parts.thighs.push(thigh);
  parts.shins.push(shin);

 }


 return {
  group,
  parts
 };

}


/* =====================================================
   3D INITIALIZATION
===================================================== */

function init3D(exercise){

 const host=document.getElementById("viewer");

 if(!host)return;


 scene=new THREE.Scene();

 scene.background=
 new THREE.Color(0x020604);


 camera=
 new THREE.PerspectiveCamera(
  42,
  host.clientWidth/host.clientHeight,
  .1,
  100
 );


 camera.position.set(
  4,
  3,
  6
 );


 renderer=
 new THREE.WebGLRenderer({
  antialias:true
 });


 renderer.setPixelRatio(
  Math.min(window.devicePixelRatio,2)
 );


 renderer.setSize(
  host.clientWidth,
  host.clientHeight
 );


 renderer.shadowMap.enabled=true;


 host.appendChild(
  renderer.domElement
 );


 controls=
 new OrbitControls(
  camera,
  renderer.domElement
 );


 controls.enableDamping=true;

 controls.target.set(
  0,
  1.7,
  0
 );


 controls.minDistance=3;

 controls.maxDistance=9;


 /* lighting */

 scene.add(
  new THREE.HemisphereLight(
   0xd8fff0,
   0x101510,
   2
  )
 );


 const light=
 new THREE.DirectionalLight(
  0xffffff,
  3
 );

 light.position.set(
  4,
  7,
  5
 );

 scene.add(light);


 /* floor */

 const floor=
 new THREE.Mesh(
  new THREE.CylinderGeometry(
   4,
   4,
   .12,
   64
  ),
  new THREE.MeshStandardMaterial({
   color:0x09130f,
   roughness:.9
  })
 );


 floor.position.y=-.08;

 scene.add(floor);


 /* grid */

 const grid=
 new THREE.GridHelper(
  8,
  24,
  0x28543e,
  0x162b21
 );

 scene.add(grid);


 /* character */

 character=
 createHumanoid();

 scene.add(
  character.group
 );


 clock=new THREE.Clock();


 let time=0;


 function animate(){

  animationFrame=
   requestAnimationFrame(animate);


  const delta=
   Math.min(
    clock.getDelta(),
    .033
   );


  const speed=
   Number(
    document.getElementById("speed")?.value || 1
   );


  time+=delta*speed;


  animateCharacter(
   exercise,
   time,
   character.parts
  );


  controls.update();

  renderer.render(
   scene,
   camera
  );

 }


 animate();


 window.onresize=()=>{

  if(!renderer)return;

  camera.aspect=
   host.clientWidth/
   host.clientHeight;

  camera.updateProjectionMatrix();

  renderer.setSize(
   host.clientWidth,
   host.clientHeight
  );

 };


 document
 .getElementById("speed")
 ?.addEventListener(
  "input",
  e=>{
   document.getElementById(
    "speedValue"
   ).textContent=
   e.target.value+"×";
  }
 );


 let reps=0;


 document
 .getElementById("repButton")
 ?.addEventListener(
  "click",
  ()=>{

   reps++;

   document.getElementById(
    "repCount"
   ).textContent=reps;


   const p=getProgress();

   p.reps++;

   p.workouts=Math.max(
    p.workouts,
    1
   );

   saveProgress(p);

  }
 );


}


/* =====================================================
   EXERCISE ANIMATION
===================================================== */

function animateCharacter(
 type,
 time,
 p
){

 const cycle=
  (Math.sin(time*2.4)+1)/2;


 /* reset */

 p.root.position.y=0;

 p.root.rotation.set(
  0,0,0
 );

 p.pelvis.position.y=1.35;

 p.torso.rotation.set(
  0,0,0
 );


 p.thighs.forEach(
  x=>x.rotation.set(0,0,0)
 );

 p.shins.forEach(
  x=>x.rotation.set(0,0,0)
 );


 p.arms.forEach(
  (x,i)=>{
   x.rotation.z=
    (i?1:-1)*.20;
  }
 );


 p.forearms.forEach(
  (x,i)=>{
   x.rotation.z=
    (i?1:-1)*.20;
  }
 );


 /* SQUAT */

 if(type==="squat"){

  const depth=
   cycle*.60;

  p.pelvis.position.y=
   1.35-depth;

  p.torso.rotation.x=
   depth*.25;

  p.thighs.forEach(
   x=>x.rotation.x=
    depth*.8
  );

  p.shins.forEach(
   x=>x.rotation.x=
    -depth*.8
  );

  p.arms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*
     (.2+depth*.3);
   }
  );

 }


 /* CURL */

 if(type==="curl"){

  p.arms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*.15;
   }
  );

  p.forearms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*
     (-.8+cycle*1.6);
   }
  );

 }


 /* PUSHUP */

 if(type==="pushup"){

  p.root.rotation.z=-.03;

  p.root.rotation.x=-.10;

  p.root.position.y=
   1.35-cycle*.5;

  p.arms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*
     (.3+cycle*.35);
   }
  );

 }


 /* LUNGE */

 if(type==="lunge"){

  p.pelvis.position.y=
   1.35-cycle*.4;

  p.torso.rotation.x=
   cycle*.1;

  p.thighs[0].rotation.x=
   cycle*.7;

  p.shins[0].rotation.x=
   -cycle*.7;

  p.thighs[1].rotation.x=
   -cycle*.4;

 }


 /* JUMP SQUAT */

 if(type==="jump"){

  const depth=
   cycle*.65;

  p.pelvis.position.y=
   1.35-depth+
   Math.max(
    0,
    Math.sin(time*2.4)
   )*.18;

  p.thighs.forEach(
   x=>x.rotation.x=
    depth*.8
  );

  p.shins.forEach(
   x=>x.rotation.x=
    -depth*.8
  );

 }


 /* ROW */

 if(type==="row"){

  p.torso.rotation.x=.30;

  p.arms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*
     (.5-cycle*.4);
   }
  );

  p.forearms.forEach(
   (x,i)=>{
    x.rotation.z=
     (i?1:-1)*
     (-.7+cycle*.7);
   }
  );

 }

}


/* START */

router();

</script>

</body>
</html>
