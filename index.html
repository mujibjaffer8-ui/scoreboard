<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoreboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0B0F1A; --panel:#141B2E; --panel2:#1B2440; --line:#26314F;
    --text:#E9EDF7; --muted:#8592B0; --amber:#FFC145; --live:#FF4B4B;
    --win:#5CE6A8;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *{box-sizing:border-box;}
  html{scroll-padding-top:env(safe-area-inset-top,0px);}
  html,body{height:100%;}
  body{
    margin:0; background:var(--bg); color:var(--text);
    font-family:'Inter',system-ui,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .app{max-width:720px; margin:0 auto; min-height:100%; display:flex; flex-direction:column;}

  header{
    position:sticky; top:env(safe-area-inset-top,0px); z-index:5;
    background:var(--bg); padding:18px 16px 0; border-bottom:1px solid var(--line);
  }
  .title-row{display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px;}
  h1{
    font-family:'Space Mono',monospace; font-weight:700; font-size:22px;
    margin:0; letter-spacing:-0.5px;
  }
  .clock{font-family:'Space Mono',monospace; font-size:12px; color:var(--muted);}

  nav{display:flex; gap:4px; overflow-x:auto; padding-bottom:0; scrollbar-width:none;}
  nav::-webkit-scrollbar{display:none;}
  nav button{
    background:none; border:none; color:var(--muted); font-family:'Inter',sans-serif;
    font-size:14px; font-weight:600; padding:10px 14px; cursor:pointer;
    border-bottom:2px solid transparent; white-space:nowrap;
  }
  nav button.active{color:var(--text); border-bottom-color:var(--amber);}

  main{flex:1; padding:16px; padding-bottom:40px;}

  .toolbar{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .day-label{font-size:13px; color:var(--muted);}
  .refresh{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    font-size:12px; font-weight:600; padding:7px 12px; border-radius:8px; cursor:pointer;
  }
  .refresh:active{transform:scale(0.97);}

  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:12px;
    padding:14px 16px; margin-bottom:10px; cursor:pointer;
  }
  .card:active{transform:scale(0.99);}

  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:20;
    display:flex; align-items:flex-end; justify-content:center;
  }
  .overlay.hidden{display:none;}
  .sheet{
    background:var(--panel); width:100%; max-width:720px; max-height:82vh;
    border-radius:16px 16px 0 0; border:1px solid var(--line); border-bottom:none;
    overflow-y:auto; padding:16px 16px calc(24px + env(safe-area-inset-bottom,0px));
  }
  .sheet-head{display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;}
  .sheet-head h2{font-size:15px; margin:0; font-weight:700;}
  .sheet-close{
    background:var(--panel2); border:1px solid var(--line); color:var(--text);
    width:30px; height:30px; border-radius:50%; font-size:16px; line-height:1;
    cursor:pointer;
  }
  .event-row{
    display:flex; gap:10px; padding:8px 0; border-bottom:1px solid var(--line); font-size:13px;
  }
  .event-row:last-child{border-bottom:none;}
  .event-time{
    font-family:'Space Mono',monospace; color:var(--amber); min-width:44px; flex:none;
  }
  .event-desc{color:var(--text); line-height:1.4;}
  .event-desc .sub{color:var(--muted); font-size:12px; display:block;}
  .sheet-section-title{
    font-size:11px; color:var(--muted); text-transform:uppercase; letter-spacing:0.5px;
    margin:14px 0 6px;
  }
  .sheet-link{
    display:inline-block; margin-top:14px; color:var(--amber); font-size:13px;
    text-decoration:none; font-weight:600;
  }
  .inning-line{font-family:'Space Mono',monospace; font-size:14px; margin-bottom:4px;}
  .card-top{display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;}
  .status{
    font-family:'Space Mono',monospace; font-size:11px; font-weight:700;
    color:var(--muted); letter-spacing:0.5px;
  }
  .status.live{color:var(--live);}
  .status.live::before{content:"● "; }
  .league{font-size:11px; color:var(--muted);}

  .team-row{display:flex; align-items:center; justify-content:space-between; padding:4px 0;}
  .team-name{display:flex; align-items:center; gap:8px; font-size:15px; font-weight:500;}
  .team-name.winner{font-weight:700; color:var(--win);}
  .logo{width:22px; height:22px; border-radius:4px; object-fit:contain; background:#fff1; flex:none;}
  .score{font-family:'Space Mono',monospace; font-size:18px; font-weight:700; min-width:32px; text-align:right;}

  .empty, .error, .loading{
    color:var(--muted); font-size:14px; text-align:center; padding:60px 20px; line-height:1.6;
  }
  .error{color:var(--live);}

  @media (prefers-color-scheme: light){
    :root:not([data-theme="dark"]){
      --bg:#F7F8FB; --panel:#FFFFFF; --panel2:#EEF1F8; --line:#E2E6F0;
      --text:#141B2E; --muted:#6B7690; --amber:#B8790F; --live:#D3372B; --win:#1B9E63;
    }
    body{background:var(--bg);}
  }
</style>
</head>
<body>
<div class="app">
  <header>
    <div class="title-row">
      <h1>SCOREBOARD</h1>
      <div class="clock" id="clock"></div>
    </div>
    <nav id="tabs">
      <button data-sport="nba" class="active">NBA</button>
      <button data-sport="nfl">NFL</button>
      <button data-sport="soccer">Soccer · EPL</button>
      <button data-sport="cricket">Cricket</button>
    </nav>
  </header>
  <main>
    <div class="toolbar">
      <span class="day-label" id="dayLabel">Today</span>
      <button class="refresh" id="refreshBtn">Refresh</button>
    </div>
    <div id="games"><div class="loading">Loading scores…</div></div>
  </main>
</div>

<div class="overlay hidden" id="overlay">
  <div class="sheet">
    <div class="sheet-head">
      <h2 id="sheetTitle">Match details</h2>
      <button class="sheet-close" id="sheetClose">✕</button>
    </div>
    <div id="sheetBody"><div class="loading">Loading details…</div></div>
  </div>
</div>

<script>
const ENDPOINTS = {
  nba:    "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/scoreboard",
  nfl:    "https://site.api.espn.com/apis/site/v2/sports/football/nfl/scoreboard",
  soccer: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/scoreboard"
};
const CRICKET_HEADER = "https://site.web.api.espn.com/apis/personalized/v2/scoreboard/header?sport=cricket&region=in&tz=Asia/Calcutta";

let currentSport = "nba";
let timer = null;

function setClock(){
  const el = document.getElementById('clock');
  el.textContent = new Date().toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'});
}
setClock();
setInterval(setClock, 30000);

document.getElementById('tabs').addEventListener('click', (e)=>{
  const btn = e.target.closest('button');
  if(!btn) return;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  currentSport = btn.dataset.sport;
  loadScores();
});
document.getElementById('refreshBtn').addEventListener('click', loadScores);

function statusInfo(comp){
  const st = comp.status?.type || {};
  if(st.state === 'in') return {label: comp.status.type.shortDetail || 'LIVE', live:true};
  if(st.state === 'post') return {label: 'FINAL', live:false};
  const d = new Date(comp.date);
  return {label: d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}), live:false};
}

function renderCard(event){
  const comp = event.competitions?.[0];
  if(!comp) return '';
  const competitors = comp.competitors || [];
  const st = statusInfo(comp);
  const league = event.league?.abbreviation || '';
  const espnLink = (event.links || []).find(l=>l.href)?.href || '';

  const rows = competitors.map(c=>{
    const name = c.team?.displayName || c.athlete?.displayName || 'TBD';
    const logo = c.team?.logo;
    const score = (c.score !== undefined && c.score !== null && c.score !== '') ? c.score : '-';
    const isWinner = c.winner === true;
    return `<div class="team-row">
      <span class="team-name ${isWinner?'winner':''}">
        ${logo ? `<img class="logo" src="${logo}" alt="" loading="lazy">` : ''}
        ${name}
      </span>
      <span class="score">${score}</span>
    </div>`;
  }).join('');

  return `<div class="card" data-id="${event.id}" data-sport="${currentSport}"
    data-series="${event._seriesId || ''}" data-link="${espnLink}">
    <div class="card-top">
      <span class="status ${st.live?'live':''}">${st.label}</span>
      <span class="league">${league}</span>
    </div>
    ${rows}
  </div>`;
}

async function loadCricketEvents(){
  const headerRes = await fetch(CRICKET_HEADER);
  if(!headerRes.ok) throw new Error('bad header response');
  const headerData = await headerRes.json();
  const series = (headerData.sports?.[0]?.leagues || []).slice(0, 4);
  if(series.length === 0) return [];

  const boards = await Promise.all(series.map(async s=>{
    try{
      const r = await fetch(`https://site.api.espn.com/apis/site/v2/sports/cricket/${s.id}/scoreboard`);
      if(!r.ok) return [];
      const d = await r.json();
      return (d.events || []).map(e=>{
        if(!e.league) e.league = { abbreviation: s.abbreviation || s.shortName || 'CRICKET' };
        e._seriesId = s.id;
        return e;
      });
    }catch(_){ return []; }
  }));
  return boards.flat();
}

async function loadScores(){
  const container = document.getElementById('games');
  container.innerHTML = '<div class="loading">Loading scores…</div>';
  try{
    let events;
    if(currentSport === 'cricket'){
      events = await loadCricketEvents();
      document.getElementById('dayLabel').textContent = 'Active series';
    } else {
      const res = await fetch(ENDPOINTS[currentSport]);
      if(!res.ok) throw new Error('bad response');
      const data = await res.json();
      events = data.events || [];
      document.getElementById('dayLabel').textContent = data.day?.date || 'Today';
    }

    if(events.length === 0){
      container.innerHTML = '<div class="empty">No games scheduled right now.</div>';
      return;
    }
    container.innerHTML = events.map(renderCard).join('');
  }catch(err){
    container.innerHTML = '<div class="error">Could not load scores. Check your connection and hit Refresh.</div>';
  }
  clearTimeout(timer);
  timer = setTimeout(loadScores, 30000);
}

const SUMMARY_ENDPOINTS = {
  nba:    "https://site.api.espn.com/apis/site/v2/sports/basketball/nba/summary?event=",
  nfl:    "https://site.api.espn.com/apis/site/v2/sports/football/nfl/summary?event=",
  soccer: "https://site.api.espn.com/apis/site/v2/sports/soccer/eng.1/summary?event="
};

function esc(s){ return (s||'').toString().replace(/</g,'&lt;'); }

function renderSoccerDetail(data){
  const events = data.keyEvents || data.header?.competitions?.[0]?.details || [];
  if(events.length === 0) return '<div class="empty">No goal/card breakdown available yet.</div>';
  return events.map(ev=>{
    const time = ev.clock?.displayValue || '';
    const type = ev.type?.text || ev.text || 'Event';
    const player = ev.athletesInvolved?.[0]?.displayName || '';
    const team = ev.team?.displayName || '';
    return `<div class="event-row">
      <span class="event-time">${esc(time)}</span>
      <span class="event-desc">${esc(type)}${player ? ' — '+esc(player) : ''}
        <span class="sub">${esc(team)}</span>
      </span>
    </div>`;
  }).join('');
}

function renderPlaysDetail(data){
  const plays = data.scoringPlays || [];
  if(plays.length === 0) return '<div class="empty">No scoring-play breakdown available yet.</div>';
  return plays.map(p=>{
    const time = p.clock?.displayValue || (p.period?.number ? 'Q'+p.period.number : '');
    return `<div class="event-row">
      <span class="event-time">${esc(time)}</span>
      <span class="event-desc">${esc(p.text)}
        <span class="sub">${esc(p.team?.abbreviation || '')}</span>
      </span>
    </div>`;
  }).join('');
}

function renderCricketDetail(data){
  const innings = data.innings || data.header?.competitions?.[0]?.innings;
  if(!innings || innings.length === 0){
    const note = data.header?.competitions?.[0]?.status?.type?.detail
      || data.note || 'Ball-by-ball scorecard not available for this match yet.';
    return `<div class="empty">${esc(note)}</div>`;
  }
  return innings.map(inn=>{
    const team = inn.team?.displayName || inn.batTeam?.name || '';
    const runs = inn.runs ?? inn.score ?? '';
    const wkts = inn.wickets ?? inn.wkts ?? '';
    const overs = inn.overs ?? inn.oversStr ?? '';
    let line = `<div class="inning-line">${esc(team)}: ${runs}${wkts!=='' ? '/'+wkts : ''}${overs ? ' ('+overs+' ov)' : ''}</div>`;
    const batters = (inn.batting || inn.batsmen || []).slice(0,6).map(b=>{
      const name = b.athlete?.displayName || b.name || '';
      const r = b.stats?.runs ?? b.runs ?? '';
      const balls = b.stats?.balls ?? b.balls ?? '';
      return `<div class="event-row"><span class="event-desc">${esc(name)} <span class="sub">${r} (${balls}b)</span></span></div>`;
    }).join('');
    return line + batters;
  }).join('<div class="sheet-section-title">Next innings</div>');
}

async function openDetail(card){
  const { id, sport, series, link } = card.dataset;
  if(!id) return;
  document.getElementById('sheetTitle').textContent = 'Match details';
  document.getElementById('sheetBody').innerHTML = '<div class="loading">Loading details…</div>';
  document.getElementById('overlay').classList.remove('hidden');

  try{
    let html;
    if(sport === 'cricket'){
      const url = `https://site.api.espn.com/apis/site/v2/sports/cricket/${series}/summary?event=${id}`;
      const r = await fetch(url);
      if(!r.ok) throw new Error('bad');
      const data = await r.json();
      html = renderCricketDetail(data);
    } else {
      const r = await fetch(SUMMARY_ENDPOINTS[sport] + id);
      if(!r.ok) throw new Error('bad');
      const data = await r.json();
      html = (sport === 'soccer') ? renderSoccerDetail(data) : renderPlaysDetail(data);
    }
    if(link) html += `<a class="sheet-link" href="${link}" target="_blank" rel="noopener">View full match center on ESPN ↗</a>`;
    document.getElementById('sheetBody').innerHTML = html;
  }catch(err){
    let html = '<div class="error">Could not load match details.</div>';
    if(link) html += `<a class="sheet-link" href="${link}" target="_blank" rel="noopener">View full match center on ESPN ↗</a>`;
    document.getElementById('sheetBody').innerHTML = html;
  }
}

document.getElementById('games').addEventListener('click', (e)=>{
  const card = e.target.closest('.card');
  if(card) openDetail(card);
});
document.getElementById('sheetClose').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.add('hidden');
});
document.getElementById('overlay').addEventListener('click', (e)=>{
  if(e.target.id === 'overlay') document.getElementById('overlay').classList.add('hidden');
});

loadScores();
</script>
</body>
</html>
